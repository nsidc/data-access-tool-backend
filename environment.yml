name: dat-backend
channels:
  - conda-forge
  - nodefaults
dependencies:
  - python ~=3.14.0
  - pydantic ~=2.13.4
  - flask ~=3.1.3
  - flask-restx ~=1.3.2
  - flask-cors ~=6.0
  - gunicorn ~=26.0
  - requests ~=2.34
  - openssl ~=3.6 # required for production ssl behind the Apache proxy.
  - flask-caching ~=2.5.0

  # Dev deps
  - pytest ~=9.1
  - pyopenssl # required for test server w/ ssl
  - pre-commit ~=4.6
  - mypy ~=2.3.1
  - bump-my-version ~=1.5
  - quarto ~=1.9
